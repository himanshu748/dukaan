name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Test
        run: python -m pytest tests -q
